<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Coach</title>
<link rel="stylesheet" href="tema.css">
<style>
/* pagina del coach: solo layout dei moduli, colori e font vengono da tema.css */
.cw{max-width:560px;margin:0 auto;padding:18px 16px 140px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.crow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.cl{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:20px;padding:14px 16px}
.cl b{font:800 22px/1 var(--display);text-transform:uppercase}
.cl small{color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:5px;font:600 12px/1.2 var(--body);color:var(--muted)}
.f input,.f select,.f textarea,.inl{width:100%;border:1.5px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:14px;padding:11px 12px;font:500 16px/1.3 var(--body)}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dh{display:flex;align-items:center;gap:10px}
.dh .sw{width:14px;height:14px;border-radius:50%;background:var(--dc);flex:none}
.dh input{flex:1;font:800 22px/1 var(--display);text-transform:uppercase;border:0;background:transparent;color:var(--ink);padding:4px 0;min-width:0}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.tabs button{border:0;border-radius:999px;padding:10px 6px;background:var(--bg);font:700 13px/1 var(--body)}
.tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.el{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.el li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;background:var(--bg);border-radius:14px;padding:9px 8px 9px 10px}
.el .n{font:800 18px/1 var(--display);color:var(--muted)}
.el .t{min-width:0}
.el .t b{display:block;font:600 15px/1.25 var(--body);overflow-wrap:anywhere}
.el .t small{color:var(--muted)}
.ic{display:flex;gap:2px}
.ic button{border:0;background:none;width:34px;height:34px;border-radius:10px;font:600 17px/1 var(--body);color:var(--ink)}
.ic button:active{background:var(--line)}
.ic button:disabled{opacity:.25}
.small{font-size:13px;padding:9px 14px}
.danger{color:#D0021B;border-color:#D0021B}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line2);background:transparent;border-radius:999px;padding:7px 11px;font:600 13px/1 var(--body)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mph{display:flex;gap:10px;align-items:center}
.mph img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#fff;flex:none}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.foot .primary{min-height:52px;font-size:19px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{border:0;background:none;font:600 15px/1 var(--body);padding:8px 0;color:var(--ink)}
.hint{color:var(--muted);font-size:13px;margin:0}
.linkout{width:100%;min-height:90px;border-radius:14px;border:1.5px solid var(--line2);padding:10px;font:12px/1.35 ui-monospace,monospace;background:var(--bg);color:var(--ink)}
dialog .sheet label.f{color:var(--muted)}
</style>
</head><body>
<header class="apphead"><h1 id="hd">Coach</h1><span class="avatar" id="av" aria-hidden="true"></span></header>
<main class="cw" id="v"></main>
<div class="foot" id="foot" hidden><div class="in" id="footIn"></div></div>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast" hidden></div>
<script src="config.js"></script>
<script>
(function(){
const C = window.CONFIG || {};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CKEY = 'coach-pt-v1';
const M = {}; (C.macchine || []).forEach(m => M[m.id] = m);
const GRUPPI = (C.gruppi || ['Petto','Spalle','Schiena','Tricipiti','Bicipiti','Quadricipiti','Femorali','Glutei','Polpacci','Addominali']);
const VV = ['A','B','C'];
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const fmt = s => { const [y,m,d] = s.split('-').map(Number); return d + ' ' + MESI[m-1] + ' ' + y; };
const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

// colore del coach, come nell'app del cliente
(function(){
  if (!/^#[0-9a-f]{6}$/i.test(C.colore || '')) return;   // senza colore resta quello del tema
  const c = C.colore;
  const n = parseInt(c.slice(1), 16), lum = (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255;
  document.documentElement.style.setProperty('--accent', c);
  document.documentElement.style.setProperty('--on-accent', lum < 0.6 ? '#FFFFFF' : '#111111');
})();
$('hd').textContent = 'Coach'; $('av').textContent = (C.coach || 'C').trim().charAt(0).toUpperCase();

let db = {clienti: []};
try { const x = JSON.parse(localStorage.getItem(CKEY)); if (x && Array.isArray(x.clienti)) db = x; } catch (e) {}
const save = () => { try { localStorage.setItem(CKEY, JSON.stringify(db)); } catch (e) { toast('Memoria piena: scarica un backup'); } };
let cur = null, tab = {}, view = 'list';
const get = id => db.clienti.find(c => c.id === id);
let tt; function toast(m){ const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2400); }

// ---------- link per il cliente: scheda compressa dentro l'indirizzo ----------
const b64e = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
function clean(c){
  // solo quello che serve al cliente, con chiavi corte
  return {id: c.id, cliente: c.cliente, obiettivo: +c.obiettivo || c.giorni.length, varC: c.varC || 'Corpo libero', data: c.data,
    giorni: c.giorni.map(g => { const o = {id: g.id, nome: g.nome}; if (g.nota) o.nota = g.nota;
      VV.forEach(v => { if ((g[v] || []).length) o[v] = g[v].map(e => { const x = {}; if (e.m) x.m = e.m; else x.n = e.n || 'Esercizio'; x.s = +e.s || 3; x.r = e.r || '10'; if (e.g && e.g.length) x.g = e.g; if (e.p) x.p = e.p; if (e.c && e.c.length) x.c = e.c; return x; }); });
      return o; }),
    note: (c.note || []).filter(Boolean)};
}
async function encode(c){
  const bytes = new TextEncoder().encode(JSON.stringify(clean(c)));
  if (window.CompressionStream) {
    try { const z = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer()); return 'z' + b64e(z); } catch (e) {}
  }
  return 'j' + b64e(bytes);
}
function appUrl(){
  if (C.indirizzo) return C.indirizzo.replace(/\/?(index\.html)?$/, '/');
  return location.href.replace(/[#?].*$/, '').replace(/coach\.html$/, '');
}

// ---------- modelli ----------
const emptyDay = (i, nome) => ({id: 'g' + i, nome: nome || 'Allenamento ' + i, nota: '', A: [], B: [], C: []});
function newClient(from){
  const c = from ? JSON.parse(JSON.stringify(from)) : {cliente: '', obiettivo: 3, varC: 'Corpo libero', giorni: [emptyDay(1, 'Allenamento A'), emptyDay(2, 'Allenamento B'), emptyDay(3, 'Allenamento C')], note: []};
  c.id = uid(); c.cliente = from ? '' : c.cliente; c.data = iso(new Date());
  // dalla scheda di esempio: solo le chiavi che usa l'editor
  c.giorni = c.giorni.map(g => ({id: g.id, nome: g.nome, nota: g.nota || '', A: g.A || [], B: g.B || [], C: g.C || []}));
  db.clienti.unshift(c); save(); return c;
}
const freeDayId = c => { for (let i = 1; i <= 6; i++) if (!c.giorni.some(g => g.id === 'g' + i)) return i; return 0; };
const exLabel = e => e.m && M[e.m] ? M[e.m].nome : (e.n || 'Esercizio');

// ---------- viste ----------
function render(){
  scrollY0 = window.scrollY;
  if (view === 'list') return renderList();
  if (view === 'edit') return renderEdit();
}
let scrollY0 = 0;
function renderList(){
  $('foot').hidden = false;
  $('footIn').innerHTML = '<button type="button" class="primary" data-act="new">Nuovo cliente</button>';
  $('v').innerHTML =
    '<section><div class="eyebrow">' + esc([C.coach, C.palestra].filter(Boolean).join(' · ') || 'Pagina del coach') + '</div><h2>I tuoi clienti</h2></section>' +
    (db.clienti.length ? db.clienti.map(c => '<button type="button" class="cl" data-open="' + c.id + '"><b>' + esc(c.cliente || 'Senza nome') + '</b><small>' + c.giorni.length + ' allenamenti · ' + (+c.obiettivo || c.giorni.length) + ' a settimana · aggiornata il ' + fmt(c.data) + (c.inviata ? ' · inviata' : ' · da inviare') + '</small></button>').join('')
      : '<div class="card"><p style="margin:0">Ancora nessun cliente. Premi <b>Nuovo cliente</b>: puoi partire da una scheda vuota o dalla scheda di esempio e cambiarla.</p></div>') +
    '<details class="card"><summary><b>Backup delle schede</b></summary><p class="hint">Le schede stanno solo in questo telefono o computer. Scarica un backup ogni tanto e conservalo: serve anche per passare a un altro dispositivo.</p>' +
      '<div class="crow"><button type="button" class="ghost small" data-act="bkdown">Scarica backup</button><label class="ghost small" style="cursor:pointer">Carica backup<input type="file" accept=".json,application/json" id="bkfile" hidden></label></div></details>' +
    '<p class="hint">Libreria: ' + Object.keys(M).length + ' macchine con foto, da config.js. App per i clienti: <a href="' + esc(appUrl()) + '">' + esc(appUrl()) + '</a></p>';
}
function renderEdit(){
  const c = get(cur); if (!c) { view = 'list'; return renderList(); }
  $('foot').hidden = false;
  $('footIn').innerHTML = '<button type="button" class="primary" data-act="send">Manda al cliente</button>';
  let h = '<div class="top"><button type="button" class="back" data-act="list">‹ Clienti</button><button type="button" class="ghost small" data-act="dup">Duplica</button></div>' +
    '<div class="card"><label class="f">Nome del cliente<input data-k="cliente" value="' + esc(c.cliente) + '" placeholder="Es. Marco" autocomplete="off"></label>' +
    '<div class="two"><label class="f">Allenamenti a settimana<input data-k="obiettivo" type="number" inputmode="numeric" min="1" max="7" value="' + esc(c.obiettivo) + '"></label>' +
    '<label class="f">Nome della variante C<input data-k="varC" value="' + esc(c.varC || 'Corpo libero') + '"></label></div>' +
    '<p class="hint">Ogni allenamento può avere fino a 3 varianti (A, B, C) con gli stessi muscoli su macchine diverse: l\'app le alterna da sola. Una variante vuota non compare.</p></div>';
  c.giorni.forEach((g, gi) => {
    const v = tab[g.id] || 'A', list = g[v] || [];
    h += '<section class="card c-' + g.id + '">' +
      '<div class="dh"><span class="sw"></span><input data-g="' + gi + '" data-gk="nome" value="' + esc(g.nome) + '" aria-label="Nome allenamento"><span class="ic"><button type="button" data-gmove="' + gi + '" data-d="-1" aria-label="Sposta su"' + (gi ? '' : ' disabled') + '>↑</button><button type="button" data-gmove="' + gi + '" data-d="1" aria-label="Sposta giù"' + (gi < c.giorni.length - 1 ? '' : ' disabled') + '>↓</button></span></div>' +
      '<label class="f">Nota per il cliente (facoltativa)<input data-g="' + gi + '" data-gk="nota" value="' + esc(g.nota) + '" placeholder="Es. recupero 90 secondi"></label>' +
      '<div class="tabs" role="group" aria-label="Variante">' + VV.map(x => '<button type="button" data-tab="' + g.id + '" data-v="' + x + '" aria-pressed="' + (x === v) + '">' + (x === 'C' ? esc(c.varC || 'C') : 'Var. ' + x) + ' · ' + (g[x] || []).length + '</button>').join('') + '</div>' +
      '<ul class="el">' + (list.length ? list.map((e, i) => '<li><span class="n">' + (i + 1) + '</span><button type="button" class="t" style="all:unset;cursor:pointer;min-width:0" data-ed="' + gi + '|' + v + '|' + i + '"><b>' + esc(exLabel(e)) + '</b><small>' + esc((e.s || 3) + ' × ' + (e.r || '10')) + (e.g && e.g.length ? ' · ' + esc(e.g.join(', ')) : '') + '</small></button>' +
        '<span class="ic"><button type="button" data-mv="' + gi + '|' + v + '|' + i + '" data-d="-1" aria-label="Su"' + (i ? '' : ' disabled') + '>↑</button><button type="button" data-mv="' + gi + '|' + v + '|' + i + '" data-d="1" aria-label="Giù"' + (i < list.length - 1 ? '' : ' disabled') + '>↓</button><button type="button" data-ed="' + gi + '|' + v + '|' + i + '" aria-label="Modifica">✎</button></span></li>').join('')
        : '<li style="grid-template-columns:1fr"><span class="hint">Nessun esercizio in questa variante.</span></li>') + '</ul>' +
      '<div class="crow"><button type="button" class="ghost small" data-add="' + gi + '|' + v + '">+ Esercizio</button>' +
      (v !== 'A' && (g.A || []).length ? '<button type="button" class="ghost small" data-copya="' + gi + '|' + v + '">Copia da A</button>' : '') +
      '<button type="button" class="ghost small danger" data-gdel="' + gi + '">Elimina</button></div></section>';
  });
  h += (freeDayId(c) ? '<button type="button" class="ghost" data-act="addday">+ Aggiungi allenamento</button>' : '<p class="hint">Massimo 6 allenamenti.</p>') +
    '<div class="card"><label class="f">Note generali, una per riga (le vede in fondo all\'app)<textarea data-k="note">' + esc((c.note || []).join('\n')) + '</textarea></label></div>' +
    '<button type="button" class="ghost danger" data-act="del">Elimina questo cliente</button>';
  $('v').innerHTML = h;
}

// ---------- foglio esercizio ----------
let ed = null;   // {gi, v, i, e}
function openEx(gi, v, i){
  const c = get(cur), g = c.giorni[gi];
  const e = i === null ? {m: '', n: '', s: 3, r: '10', g: [], p: ''} : JSON.parse(JSON.stringify(g[v][i]));
  ed = {gi, v, i, e}; drawEx(); $('dlg').showModal();
}
function machineOpts(sel){
  const by = {};
  Object.values(M).forEach(m => { const k = (m.gruppi && m.gruppi[0]) || 'Altro'; (by[k] = by[k] || []).push(m); });
  const keys = GRUPPI.filter(k => by[k]).concat(Object.keys(by).filter(k => !GRUPPI.includes(k)));
  return '<option value=""' + (sel ? '' : ' selected') + '>Esercizio libero (senza macchina)</option>' + keys.map(k => '<optgroup label="' + esc(k) + '">' + by[k].map(m => '<option value="' + esc(m.id) + '"' + (m.id === sel ? ' selected' : '') + '>' + esc(m.nome) + (m.marca ? ' · ' + esc(m.marca) : '') + '</option>').join('') + '</optgroup>').join('');
}
function drawEx(){
  const e = ed.e, m = e.m && M[e.m];
  $('sheet').innerHTML = '<div class="grab"></div><h3>' + (ed.i === null ? 'Nuovo esercizio' : 'Esercizio ' + (ed.i + 1)) + '</h3>' +
    '<label class="f">Macchina<select id="exM">' + machineOpts(e.m) + '</select></label>' +
    (m ? '<div class="mph">' + (m.foto ? '<img src="' + esc(m.foto) + '" alt="">' : '') + '<span class="hint">' + esc(m.distretto || '') + '</span></div>'
       : '<label class="f">Nome dell\'esercizio<input id="exN" value="' + esc(e.n) + '" placeholder="Es. Panca piana con bilanciere"></label>') +
    '<div class="two"><label class="f">Serie<input id="exS" type="number" inputmode="numeric" min="1" max="12" value="' + esc(e.s) + '"></label>' +
    '<label class="f">Ripetizioni<input id="exR" value="' + esc(e.r) + '" placeholder="8-10"></label></div>' +
    '<div class="f" style="display:flex;flex-direction:column;gap:6px;font:600 12px/1.2 var(--body);color:var(--muted)">Muscoli<div class="chips">' + GRUPPI.map(x => '<button type="button" data-chip="' + esc(x) + '" aria-pressed="' + (e.g || []).includes(x) + '">' + esc(x) + '</button>').join('') + '</div></div>' +
    '<label class="f">Perché, o un consiglio (facoltativo)<textarea id="exP" placeholder="Es. tieni i gomiti stretti">' + esc(e.p) + '</textarea></label>' +
    '<label class="f">Come eseguirlo, un passo per riga (facoltativo: se vuoto usa la spiegazione della macchina)<textarea id="exC">' + esc((e.c || []).join('\n')) + '</textarea></label>' +
    '<button type="button" class="primary" data-x="ok">' + (ed.i === null ? 'Aggiungi' : 'Salva') + '</button>' +
    (ed.i === null ? '' : '<button type="button" class="ghost danger" data-x="del">Elimina esercizio</button>') +
    '<button type="button" class="ghost close" data-x="no">Annulla</button>';
}
function readEx(){
  const e = ed.e;
  e.s = Math.max(1, Math.min(12, Math.round(+$('exS').value) || 3)); e.r = $('exR').value.trim() || '10';
  if ($('exN')) e.n = $('exN').value.trim();
  e.p = $('exP').value.trim(); e.c = $('exC').value.split('\n').map(x => x.trim()).filter(Boolean);
  if (!e.c.length) delete e.c; if (!e.p) delete e.p;
  if (e.m) delete e.n; else delete e.m;
}
$('dlg').addEventListener('change', e => {
  if (e.target.id === 'exM') { readEx(); ed.e.m = e.target.value; const m = M[ed.e.m]; if (m && m.gruppi && m.gruppi.length) ed.e.g = m.gruppi.slice(); drawEx(); }
});
$('dlg').addEventListener('click', e => {
  if (e.target === $('dlg')) { $('dlg').close(); return; }
  const ch = e.target.closest('[data-chip]');
  if (ch) { const x = ch.dataset.chip, g = ed.e.g = ed.e.g || []; const i = g.indexOf(x); if (i < 0) g.push(x); else g.splice(i, 1); ch.setAttribute('aria-pressed', i < 0); return; }
  const b = e.target.closest('[data-x]'); if (!b) return;
  const c = get(cur), g = c.giorni[ed.gi];
  if (b.dataset.x === 'ok') {
    readEx();
    if (!ed.e.m && !ed.e.n) { toast('Scegli una macchina o scrivi il nome'); return; }
    g[ed.v] = g[ed.v] || [];
    if (ed.i === null) g[ed.v].push(ed.e); else g[ed.v][ed.i] = ed.e;
    touch(c);
  }
  if (b.dataset.x === 'del') { g[ed.v].splice(ed.i, 1); touch(c); }
  $('dlg').close(); render(); window.scrollTo(0, scrollY0);
});

// ---------- foglio invio ----------
async function openSend(){
  const c = get(cur);
  const n = c.giorni.filter(g => VV.some(v => (g[v] || []).length)).length;
  if (!n) { toast('Aggiungi almeno un esercizio'); return; }
  if (!c.cliente.trim()) toast('Consiglio: scrivi il nome del cliente');
  c.data = iso(new Date()); save();
  const url = appUrl() + '#s=' + await encode(c);
  const msg = 'Ciao' + (c.cliente ? ' ' + c.cliente : '') + ', ecco la tua scheda' + (C.coach ? ' da ' + C.coach : '') + '. Aprila con Safari, poi Condividi e "Aggiungi alla schermata Home": funziona anche senza internet.\n' + url;
  $('sheet').innerHTML = '<div class="grab"></div><div class="eyebrow">Link della scheda · ' + Math.round(url.length / 100) / 10 + ' mila caratteri</div><h3>Manda a ' + esc(c.cliente || 'il cliente') + '</h3>' +
    '<p class="hint">Il link contiene tutta la scheda. Quando la cambi, rimandalo: al cliente restano storico, pesi e stelle.</p>' +
    '<a class="primary" style="display:grid;place-items:center;text-decoration:none;color:var(--btn-ink)" href="https://wa.me/?text=' + encodeURIComponent(msg) + '" data-sent>WhatsApp</a>' +
    (navigator.share ? '<button type="button" class="ghost" data-share>Altre app…</button>' : '') +
    '<button type="button" class="ghost" data-copy>Copia il link</button>' +
    '<a class="ghost" style="text-align:center;text-decoration:none;color:var(--ink)" href="' + esc(url) + '" target="_blank" rel="noopener">Anteprima come la vede il cliente</a>' +
    '<textarea class="linkout" readonly id="lo">' + esc(url) + '</textarea>' +
    '<button type="button" class="ghost close" data-close>Chiudi</button>';
  const sh = $('sheet');
  sh.onclick = e => {
    if (e.target.closest('[data-sent]')) { c.inviata = true; save(); }
    if (e.target.closest('[data-share]')) navigator.share({text: msg}).then(() => { c.inviata = true; save(); }).catch(() => {});
    if (e.target.closest('[data-copy]')) { const ok = () => { toast('Link copiato'); c.inviata = true; save(); }; try { navigator.clipboard.writeText(url).then(ok, () => { $('lo').select(); toast('Seleziona e copia il testo'); }); } catch (err) { $('lo').select(); } }
    if (e.target.closest('[data-close]')) { $('dlg').close(); sh.onclick = null; render(); }
  };
  if (!$('dlg').open) $('dlg').showModal();
}
function touch(c){ c.data = iso(new Date()); c.inviata = false; save(); }

// ---------- eventi della pagina ----------
$('v').addEventListener('input', e => {
  const c = get(cur); if (!c) return;
  const k = e.target.dataset.k;
  if (k === 'note') c.note = e.target.value.split('\n').map(x => x.trim()).filter(Boolean);
  else if (k === 'obiettivo') c.obiettivo = Math.max(1, Math.min(7, Math.round(+e.target.value) || 1));
  else if (k) c[k] = e.target.value;
  if (e.target.dataset.gk) c.giorni[+e.target.dataset.g][e.target.dataset.gk] = e.target.value;
  if (k === 'varC') { document.querySelectorAll('[data-v="C"]').forEach(b => b.textContent = (c.varC || 'C') + ' · ' + b.textContent.split(' · ').pop()); }
  touch(c);
});
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-open]'); if (!t || t.closest('dialog')) return;
  const d = t.dataset, c = get(cur);
  if (d.open) { cur = d.open; view = 'edit'; tab = {}; render(); scrollTo(0, 0); return; }
  if (d.act === 'list') { view = 'list'; render(); scrollTo(0, 0); return; }
  if (d.act === 'new') return openNew();
  if (d.act === 'send') return openSend();
  if (d.act === 'dup') { const n = newClient(c); n.cliente = (c.cliente ? c.cliente + ' (copia)' : ''); save(); cur = n.id; render(); scrollTo(0, 0); toast('Scheda duplicata: cambia il nome'); return; }
  if (d.act === 'del') { if (t.dataset.armed) { db.clienti = db.clienti.filter(x => x.id !== cur); save(); view = 'list'; render(); toast('Cliente eliminato'); } else { t.dataset.armed = 1; t.textContent = 'Sicuro? Tocca di nuovo per eliminare'; } return; }
  if (d.act === 'addday') { const i = freeDayId(c); c.giorni.push(emptyDay(i, 'Allenamento ' + String.fromCharCode(64 + c.giorni.length + 1))); touch(c); render(); window.scrollTo(0, scrollY0 + 300); return; }
  if (d.act === 'bkdown') return backupDown();
  if (d.tab) { tab[d.tab] = d.v; render(); window.scrollTo(0, scrollY0); return; }
  if (d.add) { const [gi, v] = d.add.split('|'); openEx(+gi, v, null); return; }
  if (d.ed) { const [gi, v, i] = d.ed.split('|'); openEx(+gi, v, +i); return; }
  if (d.mv) { const [gi, v, i] = d.mv.split('|'), l = c.giorni[+gi][v], j = +i + +d.d; [l[+i], l[j]] = [l[j], l[+i]]; touch(c); render(); window.scrollTo(0, scrollY0); return; }
  if (d.gmove) { const i = +d.gmove, j = i + +d.d, l = c.giorni; [l[i], l[j]] = [l[j], l[i]]; touch(c); render(); window.scrollTo(0, scrollY0); return; }
  if (d.copya) { const [gi, v] = d.copya.split('|'), g = c.giorni[+gi]; g[v] = JSON.parse(JSON.stringify(g.A)); touch(c); render(); window.scrollTo(0, scrollY0); toast('Copiata la A: ora cambia le macchine'); return; }
  if (d.gdel) { if (t.dataset.armed) { c.giorni.splice(+d.gdel, 1); touch(c); render(); window.scrollTo(0, scrollY0); } else { t.dataset.armed = 1; t.textContent = 'Sicuro?'; } return; }
});
function openNew(){
  const others = db.clienti;
  $('sheet').innerHTML = '<div class="grab"></div><h3>Nuovo cliente</h3><p class="hint">Da dove parti?</p>' +
    '<button type="button" class="primary" data-nw="empty">Scheda vuota</button>' +
    (C.esempio ? '<button type="button" class="ghost" data-nw="esempio">Dalla scheda di esempio</button>' : '') +
    (others.length ? '<label class="f">Copia la scheda di un altro cliente<select id="nwFrom"><option value="">Scegli…</option>' + others.map(o => '<option value="' + o.id + '">' + esc(o.cliente || 'Senza nome') + '</option>').join('') + '</select></label>' : '') +
    '<button type="button" class="ghost close" data-nw="no">Annulla</button>';
  const sh = $('sheet');
  const go = from => { const n = newClient(from); cur = n.id; view = 'edit'; tab = {}; $('dlg').close(); sh.onclick = sh.onchange = null; render(); scrollTo(0, 0); };
  sh.onclick = e => { const b = e.target.closest('[data-nw]'); if (!b) return; if (b.dataset.nw === 'no') { $('dlg').close(); sh.onclick = sh.onchange = null; return; } go(b.dataset.nw === 'esempio' ? C.esempio : null); };
  sh.onchange = e => { if (e.target.id === 'nwFrom' && get(e.target.value)) { const n = get(e.target.value); go(n); } };
  $('dlg').showModal();
}
function backupDown(){
  const blob = new Blob([JSON.stringify({tipo: 'coach-pt', data: iso(new Date()), clienti: db.clienti}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'schede-clienti-' + iso(new Date()) + '.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
document.addEventListener('change', e => {
  if (e.target.id !== 'bkfile' || !e.target.files[0]) return;
  e.target.files[0].text().then(txt => {
    const j = JSON.parse(txt); if (!j || !Array.isArray(j.clienti)) throw 0;
    const have = new Set(db.clienti.map(c => c.id)); let n = 0, u = 0;
    j.clienti.forEach(c => { if (!c || !c.id || !Array.isArray(c.giorni)) return; if (have.has(c.id)) { const i = db.clienti.findIndex(x => x.id === c.id); if ((c.data || '') > (db.clienti[i].data || '')) { db.clienti[i] = c; u++; } } else { db.clienti.push(c); n++; } });
    save(); render(); toast('Backup caricato: ' + n + ' nuovi, ' + u + ' aggiornati');
  }).catch(() => toast('File non valido'));
});
$('dlg').addEventListener('close', () => { $('sheet').onclick = $('sheet').onchange = null; });
render();
})();
</script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');</script>
